name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm install

      - name: install dprint
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh -s 0.47.2
          echo "$HOME/.dprint/bin" >> "$GITHUB_PATH"

      - name: install pre-commit
        run: pip install pre-commit==4.0.1

      - run: pre-commit run --all-files

      - run: dprint check

      - run: npm run format:check

      - run: npm run lint

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
