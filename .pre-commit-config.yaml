repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write
        language: system
        files: \.(ts|css|html)$

      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        files: ^src/.*\.ts$

      - id: tsc
        name: tsc --noEmit
        entry: npx --no-install tsc --noEmit
        language: system
        files: \.ts$
        pass_filenames: false

      - id: dprint-fmt
        name: dprint fmt
        entry: dprint fmt
        language: system
        pass_filenames: false
        files: \.md$
